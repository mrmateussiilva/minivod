services:
  minivod:
    build: .
    restart: unless-stopped
    ports:
      - "${MINIVOD_PORT:-8079}:8079"
    volumes:
      - ${MINIVOD_DATA}:/data
      - ${MINIVOD_CACHE}:/cache
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8079"
      - --workers
      - "1"
    healthcheck:
      test:
        - CMD
        - python3
        - "-c"
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8079/health').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      MINIVOD_DB: /data/vod.db
      MINIVOD_CACHE: /cache
      MINIVOD_BASE_URL: ${MINIVOD_BASE_URL}
      MINIVOD_ADMIN_USER: ${MINIVOD_ADMIN_USER:-}
      MINIVOD_ADMIN_PASSWORD: ${MINIVOD_ADMIN_PASSWORD:-}
      MINIVOD_MAX_FFMPEG_JOBS: ${MINIVOD_MAX_FFMPEG_JOBS:-2}

  scanner:
    build: .
    restart: unless-stopped
    volumes:
      - ${MINIVOD_DATA}:/data
    command:
      - /bin/sh
      - "-c"
      - >-
        while true; do
          python3 /app/scan_vod.py /data/iptv --db /data/vod.db;
          sleep "$${SCAN_INTERVAL:-300}";
        done
    environment:
      SCAN_INTERVAL: ${SCAN_INTERVAL:-300}
