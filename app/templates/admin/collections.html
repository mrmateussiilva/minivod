{% extends "base.html" %}

{% block title %}Coleções &middot; MiniVOD Admin{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center pb-3 mb-4 border-bottom border-secondary-subtle">
    <div>
        <h1 class="h3 mb-0 fw-bold">Coleções</h1>
        <p class="text-muted small mb-0">Gerencie as pastas de mídia, número de vídeos e imagens de capa.</p>
    </div>
    <div>
        <span class="badge bg-secondary-subtle text-secondary-emphasis px-3 py-2 rounded-pill fs-7">
            Total: {{ collections|length }} coleções
        </span>
    </div>
</div>

<div class="card shadow-sm" id="collections-container">
    {% include "admin/partials/_collections_table.html" %}
</div>
{% endblock %}
