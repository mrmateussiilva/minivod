{% extends "base.html" %}

{% block title %}Conteúdo &middot; MiniVOD Admin{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center pb-3 mb-4 border-bottom border-secondary-subtle">
    <div>
        <h1 class="h3 mb-0 fw-bold">Conteúdo</h1>
        <p class="text-muted small mb-0">Catálogo completo de arquivos de vídeo indexados na biblioteca.</p>
    </div>
    <div>
        <span class="badge bg-secondary-subtle text-secondary-emphasis px-3 py-2 rounded-pill fs-7">
            {{ total_videos }} vídeos encontrados
        </span>
    </div>
</div>

<!-- Filters Card -->
<div class="card p-3 mb-4 shadow-sm">
    <form hx-get="/admin/videos" hx-target="#videos-container" hx-push-url="true" hx-trigger="submit" class="row g-2 align-items-end">
        <div class="col-12 col-md-4">
            <label class="form-label small text-muted mb-1">Buscar por Título ou Arquivo</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary-subtle"><i class="bi bi-search"></i></span>
                <input type="text" name="q" value="{{ q }}" class="form-control" placeholder="Ex: Batman, S01E01...">
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <label class="form-label small text-muted mb-1">Coleção</label>
            <select name="collection" class="form-select">
                <option value="">Todas as Coleções</option>
                {% for col in collections %}
                <option value="{{ col.id }}" {% if selected_collection == col.id %}selected{% endif %}>
                    {{ col.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-12 col-sm-6 col-md-2">
            <label class="form-label small text-muted mb-1">Status</label>
            <select name="status" class="form-select">
                <option value="active" {% if status == 'active' %}selected{% endif %}>Ativos</option>
                <option value="inactive" {% if status == 'inactive' %}selected{% endif %}>Inativos</option>
                <option value="all" {% if status == 'all' %}selected{% endif %}>Todos</option>
            </select>
        </div>
        <div class="col-12 col-md-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">
                <i class="bi bi-funnel me-1"></i> Filtrar
            </button>
            <a href="/admin/videos" class="btn btn-outline-secondary">
                Limpar
            </a>
        </div>
    </form>
</div>

<!-- Videos Table Card -->
<!-- Videos Table Card (HTMX Target) -->
<div class="card shadow-sm" id="videos-container">
    {% include "admin/partials/_videos_table.html" %}
</div>
{% endblock %}
